name: Daily EOD Market Data Archival

on:
  schedule:
    # 11:00 UTC = 16:30 IST, Monday to Friday
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-eod-archival:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute EOD archival pipeline
        run: |
          python scripts/eod_job.py

      - name: Commit and push updated market archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.parquet data/research.duckdb data/predictions_log.parquet
          if git diff --staged --quiet; then
            echo "No changes in market archive."
          else
            git commit -m "chore(data): automated EOD session archival [skip ci]"
            git push origin main
          fi

